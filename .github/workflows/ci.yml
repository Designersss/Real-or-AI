name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Bootstrap PR: npm lockfile will be committed after dependency resolution.
      - run: npm install --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-package-lock
          path: package-lock.json
          retention-days: 1
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
